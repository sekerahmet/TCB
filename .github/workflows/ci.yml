# Sürekli tümleştirme: her gönderimde ve çekme isteğinde Windows ve Linux üzerinde tam denetim
# (bakim/tam_denetim.sh) çalışır. "Bitti"nin tek tanımı o betiktir; burada yalnızca kurulum ve
# kip seçimi vardır. Betiğin yaptıkları: üretilmiş dosyaların güncelliği, gofmt, go vet, VS
# Code eklentisinin JavaScript dosyaları ve package.json, derleme, Go testleri (-short), dil
# tanımı testleri ve örnek testleri (tr test), örneklerin hepsinin duman testi (çıkış kodu 0,
# zaman aşımı, uyarısız).
#
# Matris iki işlemci düzeyini kapsar: GOAMD64=v3 (2020 sonrası x86-64 işlemciler, AVX2/FMA)
# ve GOAMD64=v1 (eski işlemciler). v1 işlerinde derleme, Go testleri, tr test ve örnekler de
# v1 ile koşar; işlemci düzeyinden bağımsız durağan denetimler (biçim, vet, üretilmiş
# dosyalar, eklenti) yalnızca v3 işlerinde yapılır (betiğin --kip argümanı).
#
# Ayrıca Linux'ta yarış dedektörüyle (go test -race) yorumlayıcı, motorlar ve veri hattı
# sınanır. Bulanıklaştırma testleri haftalık ayrı bir işte uzun koşar (bulaniklastirma.yml).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  denetim:
    # İş adı değişmez: dal korumasının zorunlu denetimleri bu adlara bağlı olabilir.
    name: Denetim (${{ matrix.os }}, GOAMD64=${{ matrix.goamd64 }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        goamd64: [v3, v1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Örnek duman testinde atlanacak dosyalar (boşlukla ayrılmış adlar). Dış ağ
      # gerektiren örnekler buraya eklenir. 04_hata_ayiklama etkileşimlidir, kesme noktası boş
      # standart girişte (EOF) devam eder. 03_testler_test ayrıca `tr test` ile koşar.
      ATLANACAK_ORNEKLER: ""
      # Tek bir örneğin en uzun süresi (saniye); aşılırsa örnek başarısız sayılır.
      ORNEK_ZAMAN_ASIMI: "300"
    defaults:
      run:
        shell: bash
    steps:
      # Eylemler tam commit özetiyle sabitlenir (etiket sonradan başka bir commit'e
      # taşınabilir); yorumdaki sürüm adı yalnızca okuyan içindir.
      - name: Kaynağı al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depo kimlik bilgisi sonraki adımlara (ve onların çalıştırdığı koda) bırakılmaz.
          persist-credentials: false

      - name: Go kurulumu
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod'daki 'go' ve 'toolchain' satırları yerelde ve burada aynı sürümü seçer.
          go-version-file: go.mod

      - name: Tam denetim
        run: bash bakim/tam_denetim.sh --kip=${{ matrix.goamd64 }}

  yaris:
    name: Yarış dedektörü (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Kaynağı al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go kurulumu
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Eşzamanlı kod: yorumlayıcı kilidi ve eşzamanlı görevler, motorların kilitleri,
      # önden yükleme ve önbellek. Yarış dedektörü cgo ister (Linux koşucusunda hazır).
      - name: Yarış dedektörüyle Go testleri
        run: go test -race -short ./internal/dil/yurut ./internal/motor/... ./internal/hesap/veriyolu
