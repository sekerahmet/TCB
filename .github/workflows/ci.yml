# Sürekli tümleştirme: her gönderimde ve çekme isteğinde Windows ve Linux üzerinde tam denetim
# (tools/full_check.sh) çalışır. "Bitti"nin tek tanımı o betiktir; burada yalnızca kurulum ve
# kip seçimi vardır (betiğin --kip argümanı; kiplerin ne yaptığı betiğin başında yazar).
#
# Matris iki yapılandırmayı kapsar: dagitim (kullanıcıya giden düz `go build`, GOAMD64=v1,
# AVX2 çekirdekleri çalışma anında seçilir; durağan denetimler, ARM derlemesi, Go testleri, tr
# testleri ve örnekler) ve go-esleri (AVX2 kapalı: assembly'siz Go eşleri).
#
# Ayrıca Linux'ta yarış dedektörü (--kip=yaris) ve -short olmadan uzun Go testleri (--kip=uzun)
# koşar. Bulanıklaştırma testleri (fuzz.yml) ve testlerin kararlılığı (zorlama.yml) haftalık ayrı
# işlerde koşar.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  denetim:
    # İş adı değişmez: dal korumasının zorunlu denetimleri bu adlara bağlı olabilir.
    name: Denetim (${{ matrix.os }}, ${{ matrix.kip }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        kip: [dagitim, go-esleri]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # Örnek duman testinde atlanacak dosyalar (boşlukla ayrılmış adlar). Dış ağ
      # gerektiren örnekler buraya eklenir. 29_hata_ayiklama etkileşimlidir, kesme noktası boş
      # standart girişte (EOF) devam eder. 15_testler_test ayrıca `tr test` ile koşar.
      ATLANACAK_ORNEKLER: ""
      # Tek bir örneğin en uzun süresi (saniye); aşılırsa örnek başarısız sayılır.
      ORNEK_ZAMAN_ASIMI: "300"
    defaults:
      run:
        shell: bash
    steps:
      # Eylemler tam commit özetiyle sabitlenir (etiket sonradan başka bir commit'e
      # taşınabilir); yorumdaki sürüm adı yalnızca okuyan içindir.
      - name: Kaynağı al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depo kimlik bilgisi sonraki adımlara (ve onların çalıştırdığı koda) bırakılmaz.
          persist-credentials: false

      - name: Go kurulumu
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod'daki 'go' ve 'toolchain' satırları yerelde ve burada aynı sürümü seçer.
          go-version-file: go.mod

      - name: Tam denetim
        run: bash tools/full_check.sh --kip=${{ matrix.kip }}

  yaris:
    name: Yarış dedektörü (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Kaynağı al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go kurulumu
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Hangi paketlerin sınandığı betiktedir (--kip=yaris). Yarış dedektörü cgo ister
      # (Linux koşucusunda hazır).
      - name: Yarış dedektörüyle Go testleri
        run: bash tools/full_check.sh --kip=yaris

  uzun:
    name: Uzun testler (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Kaynağı al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go kurulumu
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # -short olmadan: her .tr dosyasının İngilizce gidiş-dönüşü gibi uzun sınamalar.
      - name: Uzun Go testleri
        run: bash tools/full_check.sh --kip=uzun
