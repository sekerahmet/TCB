# Bulanıklaştırma: güvenilmeyen girdi okuyan her yerin bulanıklaştırma testi (Go'nun Fuzz*
# hedefleri) haftada bir, her hedef kısa bir süre (varsayılan 30 sn) rastgele girdiyle koşar.
# Sıradan go test yalnızca tohum derlemini koşar; bu iş yeni girdi üretir. Elle de
# tetiklenebilir (Actions → Bulanıklaştırma → Run workflow), süre seçilerek. Bir hedef düşerse
# düşüren girdi günlükte yazılır; yerelde `go test -run=<Hedef>/<dosya>` ile yeniden üretmek
# için dosya testdata/fuzz/<Hedef>/ altına konur. Koşum bakim/bulaniklastir.sh'tadır.
name: Bulanıklaştırma

on:
  schedule:
    # Her pazartesi 03:17 (UTC).
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      sure:
        description: "Her hedefin süresi (Go süre biçimi: 30s, 2m)"
        required: false
        default: "30s"

permissions:
  contents: read

jobs:
  bulanik:
    name: Bulanıklaştırma (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Eylemler tam commit özetiyle sabitlenir (ci.yml ile aynı sürümler).
      - name: Kaynağı al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go kurulumu
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Bağımlılık yok (go.sum yok); modül önbelleğine gerek yok.
          cache: false

      - name: Her bulanıklaştırma hedefi
        env:
          # Girdi betiğe ortam değişkeniyle geçer (komut satırına doğrudan yazılmaz).
          SURE: ${{ inputs.sure || '30s' }}
        run: bash bakim/bulaniklastir.sh "$SURE"
