# Bulanıklaştırma: güvenilmeyen girdi okuyan her yerin bulanıklaştırma testi (Go'nun Fuzz*
# hedefleri) haftada bir, her hedef kısa bir süre (varsayılan 30 sn) rastgele girdiyle koşar.
# Sıradan go test yalnızca tohum derlemini koşar; bu iş yeni girdi üretir. Elle de
# tetiklenebilir (Actions → Bulanıklaştırma → Run workflow), süre seçilerek. Bir hedef düşerse
# düşüren girdi günlükte yazılır ve "dusuren-girdiler" yapıtı olarak saklanır; yerelde
# `go test -run=<Hedef>/<dosya>` ile yeniden üretmek için dosya testdata/fuzz/<Hedef>/ altına konur. Koşum tools/fuzz.sh'tadır.
name: Bulanıklaştırma

on:
  schedule:
    # Her pazartesi 03:17 (UTC).
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      sure:
        description: "Her hedefin süresi (Go süre biçimi: 30s, 2m)"
        required: false
        default: "30s"

permissions:
  contents: read

jobs:
  bulanik:
    name: Bulanıklaştırma (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Eylemler tam commit özetiyle sabitlenir (ci.yml ile aynı sürümler).
      - name: Kaynağı al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Go kurulumu
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Her bulanıklaştırma hedefi
        env:
          # Girdi betiğe ortam değişkeniyle geçer (komut satırına doğrudan yazılmaz).
          SURE: ${{ inputs.sure || '30s' }}
        # AVX2 assembly çekirdekleri çalışma anında seçilir (koşucuda AVX2 var), bulanıklaştırma
        # onları da Go eşleriyle karşılaştırır; GOAMD64 ayarı gerekmez.
        run: bash tools/fuzz.sh "$SURE"

      # Düşüren girdiler (testdata/fuzz/<Hedef>/) yapıt olarak saklanır: indirilip depoya
      # konunca `go test -run=<Hedef>/<dosya>` ile yeniden üretilir.
      - name: Düşüren girdileri sakla
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dusuren-girdiler
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
