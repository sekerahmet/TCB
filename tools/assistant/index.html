<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src http://127.0.0.1:*/lang/ file: 'sha256-LfJlBv6S2Okgf2mu7y+Mm9qQhQn18TeFkGTRuwqQC8g='; style-src 'sha256-v3zH39miZ2wxoUq8szE97+KOAXSehayv6VW/n9jyQkI='; connect-src http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<title></title>
<style>
:root {
  color-scheme: dark;
  --bg: #080b0e;
  --panel: #0e1317;
  --raised: #141b21;
  --line: #24323b;
  --line-soft: #18232b;
  --text: #e6edf2;
  --muted: #9dafba;
  --accent: #62d9c9;
  --accent-soft: #2d7169;
  --warn: #f4bd52;
  --warn-bg: #1b1609;
  --danger: #ff9184;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
  --sans: system-ui, "Segoe UI", Roboto, "Noto Sans", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  padding: 10px;
  height: 100dvh;
  display: grid;
  gap: 10px;
  grid-template-columns: clamp(220px, 18vw, 270px) minmax(0, 1fr) clamp(210px, 17vw, 250px);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top top" "left center right";
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--sans);
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.label {
  margin: 0 0 8px;
  font: 11px/1.4 var(--mono);
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--muted);
}
.panel {
  min-height: 0;
  background: var(--panel);
  border: 1px solid var(--line-soft);
  border-radius: 10px;
}

/* Üst şerit */
.top {
  grid-area: top;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
  min-width: 0;
}
.brand {
  font: 600 13px/1.4 var(--mono);
  letter-spacing: .18em;
  text-transform: uppercase;
}
.top-state { font: 12px/1.4 var(--mono); color: var(--muted); }
.banner {
  flex: 1 1 280px;
  min-width: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 2px 14px;
  font-size: 13px;
}
.banner-mock {
  padding: 3px 10px;
  border: 1px solid var(--warn);
  border-radius: 6px;
  background: var(--warn-bg);
  color: var(--warn);
}
.banner-conn { padding: 4px 0; color: var(--danger); }
.top-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pick {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
}
select, .input, .btn {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--raised);
}
select { padding: 3px 6px; font-size: 13px; color: var(--text); max-width: 190px; }
.btn { padding: 5px 12px; cursor: pointer; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--accent-soft); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-small { padding: 3px 10px; font-size: 13px; }

/* Sol */
.left {
  grid-area: left;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 12px;
  overflow-y: auto;
}
.input { width: 100%; padding: 6px 10px; }
.input::placeholder { color: var(--muted); }
.search-count { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.metric {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0 10px;
  padding-block: 5px;
  border-block-end: 1px solid var(--line-soft);
  font-size: 13px;
}
.metric dt { color: var(--muted); }
.metric dd { margin: 0; font-family: var(--mono); unicode-bidi: plaintext; }
.metrics { margin: 0; }
.calls { margin: 0; padding: 0; list-style: none; font-size: 12px; }
.calls li { padding-block: 5px; border-block-end: 1px solid var(--line-soft); }
.call-name { display: block; font-family: var(--mono); overflow-wrap: anywhere; }
.call-info { color: var(--muted); }
.empty { margin: 0; font-size: 13px; color: var(--muted); }

/* Orta */
.center {
  grid-area: center;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.sheet {
  max-height: 34%;
  overflow-y: auto;
  padding: 12px 14px;
  border-block-end: 1px solid var(--line);
  background: var(--raised);
}
.sheet ul { margin: 0; padding: 0; list-style: none; font-size: 13px; }
.sheet li {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0 12px;
  padding-block: 3px;
}
.sheet code { font-family: var(--mono); overflow-wrap: anywhere; }
.sheet .warn-text { color: var(--warn); }
.token-box {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-block-end: 1px solid var(--line);
}
.token-box .input { flex: 1 1 200px; width: auto; }
.token-box p { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--muted); }
.dropped {
  margin: 0;
  padding: 4px 14px;
  font-size: 12px;
  color: var(--muted);
  border-block-end: 1px solid var(--line-soft);
}
.stream {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.stream-empty {
  position: absolute;
  inset-inline: 0;
  inset-block-start: 40%;
  margin: 0;
  padding-inline: 14px;
  color: var(--muted);
  text-align: center;
  pointer-events: none;
}
.row { min-width: 0; }
.msg { padding-inline-start: 12px; border-inline-start: 2px solid var(--line); }
.msg.assistant { border-inline-start-color: var(--accent-soft); }
.msg-head { font: 11px/1.6 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.msg-text { white-space: pre-wrap; overflow-wrap: anywhere; unicode-bidi: plaintext; }
.msg.draft .msg-text { color: var(--muted); font-style: italic; }
.msg.streaming .msg-text::after {
  content: "\258d";
  color: var(--accent);
  animation: blink 1s steps(2) infinite;
}
.tool {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 10px;
  padding: 4px 10px;
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  background: var(--raised);
  font: 13px/1.5 var(--mono);
}
.tool-mark { min-width: 1em; color: var(--accent); }
.tool[data-result="error"] .tool-mark, .tool[data-result="denied"] .tool-mark { color: var(--danger); }
.tool-name { overflow-wrap: anywhere; min-width: 0; }
.tool-result, .tool-time { color: var(--muted); }
.tool-time, .call-info { unicode-bidi: plaintext; }
.out { flex-basis: 100%; min-width: 0; }
.out summary { cursor: pointer; color: var(--muted); }
.out pre {
  margin: 6px 0 2px;
  max-height: 40vh;
  overflow: auto;
  padding: 8px;
  border: 1px solid var(--line-soft);
  border-radius: 6px;
  background: var(--bg);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 12px;
}
.out p { margin: 4px 0 0; font: 13px/1.5 var(--sans); }
.note { font-size: 13px; color: var(--muted); padding-inline-start: 14px; }
.note.notice-error, .out .notice-error { color: var(--danger); }
.note.notice-warn, .out .notice-warn { color: var(--warn); }
.text-cut { margin: 4px 0 0; font-size: 13px; color: var(--warn); }
.jump {
  position: absolute;
  inset-inline-end: 16px;
  inset-block-end: 76px;
  z-index: 1;
}

/* Onay kartları: akışın dışında, model metninin ulaşamadığı ayrı yuva */
.approvals {
  flex: 0 0 auto;
  max-height: 55%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-inline: 14px;
}
.approvals:not(:empty) { padding-block: 10px; border-block-start: 1px solid var(--line); }
.card {
  padding: 10px 12px;
  border: 2px solid var(--warn);
  border-radius: 8px;
  background: var(--warn-bg);
}
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; }
.card-title { margin: 0; font: 600 14px/1.5 var(--sans); color: var(--warn); }
.card-time { font: 13px/1.6 var(--mono); color: var(--text); }
.card-field { margin: 6px 0 2px; font-size: 12px; color: var(--muted); }
.card-tool { font-family: var(--mono); overflow-wrap: anywhere; }
.card-args {
  margin: 0;
  max-height: 180px;
  overflow: auto;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--bg);
  font: 12px/1.5 var(--mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.card-note { margin: 6px 0 0; font-size: 13px; color: var(--warn); }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-block-start: 10px; }
.btn-deny { background: var(--text); border-color: var(--text); color: var(--bg); font-weight: 600; }
.btn-approve { border-color: var(--warn); background: transparent; color: var(--warn); }

.composer {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 14px;
  border-block-start: 1px solid var(--line);
}
.composer .input { flex: 1 1 220px; width: auto; }

/* Sağ */
.right {
  grid-area: right;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 12px;
  padding: 14px 12px;
  overflow-y: auto;
}
.ring-box { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.ring { width: min(100%, 176px); height: auto; aspect-ratio: 1; }
.state-text {
  margin: 0;
  font: 13px/1.4 var(--mono);
  letter-spacing: .08em;
  text-transform: uppercase;
  text-align: center;
  color: var(--accent);
}
.right[data-state="error"] .state-text { color: var(--danger); }
.right[data-state="offline"] .state-text { color: var(--muted); }
.info { min-width: 0; font-size: 13px; }
.info p { margin: 0 0 6px; overflow-wrap: anywhere; }
.info span { display: block; }
.info .label { margin-block-end: 0; }
.switches { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.switch {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0 10px;
  width: 100%;
  padding: 6px 10px;
  text-align: start;
  font: 12px/1.5 var(--mono);
  letter-spacing: .06em;
}
.switch[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.switch-value { color: var(--muted); }

/* Durum halkası: her durumun kendi biçimi var, renk tek başına anlatmaz */
.ring circle, .ring path, .ring line, .ring rect { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.ring .r-base { stroke: var(--line); }
.ring .r-seg { stroke: var(--accent-soft); stroke-width: 7; stroke-dasharray: 7 8; }
.ring .r-fill { fill: var(--accent); stroke: none; }
.ring .r-track { stroke: var(--line); stroke-width: 6; }
.ring .r-arc { stroke-width: 6; transform: rotate(-90deg); transform-origin: 100px 100px; }
.ring .r-arc.indeterminate { animation: spin 1.6s linear infinite; }
.ring .r-bar { fill: var(--accent); stroke: none; transform-origin: 100px 100px; animation: bar 1.1s ease-in-out infinite alternate; }
.ring .r-bar:nth-of-type(2) { animation-delay: .15s; }
.ring .r-bar:nth-of-type(3) { animation-delay: .3s; }
.ring .r-bar:nth-of-type(4) { animation-delay: .45s; }
.ring .r-bar:nth-of-type(5) { animation-delay: .6s; }
.ring .r-orbit-a { stroke-dasharray: 2 12; stroke-width: 4; stroke-linecap: round; transform-origin: 100px 100px; animation: spin 5s linear infinite; }
.ring .r-orbit-b { stroke-dasharray: 18 14; transform-origin: 100px 100px; animation: spin 3.4s linear infinite reverse; }
.ring .r-wave { transform-origin: 100px 100px; animation: wave 2.1s ease-out infinite; }
.ring .r-wave:nth-of-type(2) { animation-delay: .7s; }
.ring .r-wave:nth-of-type(3) { animation-delay: 1.4s; }
.ring [data-for] { display: none; }
.ring[data-state="idle"] [data-for="idle"],
.ring[data-state="loading"] [data-for="loading"],
.ring[data-state="listening"] [data-for="listening"],
.ring[data-state="thinking"] [data-for="thinking"],
.ring[data-state="speaking"] [data-for="speaking"],
.ring[data-state="error"] [data-for="error"],
.ring[data-state="offline"] [data-for="offline"] { display: block; }
.ring[data-state="listening"] .r-seg { stroke: var(--accent); }
.ring[data-state="error"] .r-seg, .ring[data-state="error"] [data-for="error"] path { stroke: var(--danger); }
.ring[data-state="error"] .r-seg { stroke-dasharray: 7 38; }
.ring[data-state="error"] [data-for="error"] .r-fill { fill: var(--danger); }
.ring[data-state="offline"] .r-seg { stroke: var(--line); stroke-dasharray: 2 13; }
.ring[data-state="offline"] [data-for="offline"] * { stroke: var(--muted); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bar { from { transform: scaleY(.45); } to { transform: scaleY(1); } }
@keyframes wave { from { transform: scale(.35); opacity: 1; } to { transform: scale(1); opacity: 0; } }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .ring .r-wave { opacity: .7; }
  .ring .r-wave:nth-of-type(2) { transform: scale(.7); }
  .ring .r-wave:nth-of-type(3) { transform: scale(.4); }
}

/* Dar ekran: sağ panel üste şerit olur */
@media (max-width: 1000px) {
  body {
    grid-template-columns: 200px minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr);
    grid-template-areas: "top top" "right right" "left center";
  }
  .right { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 8px 12px; gap: 8px 16px; }
  .ring-box { flex-direction: row; gap: 10px; }
  .ring { width: 64px; flex: 0 0 64px; }
  .state-text { text-align: start; }
  .info { flex: 1 1 160px; display: flex; flex-wrap: wrap; gap: 0 16px; }
  .info p { margin: 0; }
  .switches { flex: 1 1 100%; flex-direction: row; flex-wrap: wrap; }
  .switch { width: auto; flex: 1 1 120px; }
}
@media (max-width: 640px) {
  body {
    height: auto;
    min-height: 100dvh;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: none;
    grid-template-areas: "top" "right" "center" "left";
  }
  .center { height: 75dvh; }
}
body.focus {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top" "center";
}
body.focus .left, body.focus .right { display: none; }
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand"></div>
  <div class="top-state" id="topState" hidden></div>
  <div class="banner" id="banner" role="status">
    <span class="banner-mock" id="bannerMock" data-i18n="banner_mock" hidden></span>
    <span class="banner-conn" id="bannerConn" hidden></span>
  </div>
  <div class="top-tools">
    <span class="pick" id="scenePick" hidden>
      <label for="sceneSelect" data-i18n="scene_label"></label>
      <select id="sceneSelect"></select>
      <button class="btn btn-small" id="scenePlay" type="button" data-i18n="scene_play"></button>
    </span>
    <span class="pick">
      <label for="languageSelect" data-i18n="language_label"></label>
      <select id="languageSelect"></select>
    </span>
    <button class="btn btn-small" id="focusExit" type="button" data-i18n="button_focus_exit" hidden></button>
  </div>
</header>

<aside class="panel left" id="left">
  <section>
    <h2 class="label"><label for="search" data-i18n="search_title"></label></h2>
    <input class="input" id="search" type="search" autocomplete="off" data-i18n="search_placeholder" data-i18n-attr="placeholder">
    <p class="search-count" id="searchCount" hidden></p>
  </section>
  <section>
    <h2 class="label" data-i18n="metrics_title"></h2>
    <dl class="metrics">
      <div class="metric"><dt data-i18n="metric_memory"></dt><dd id="metricMemory"></dd></div>
      <div class="metric"><dt data-i18n="metric_tps"></dt><dd id="metricTps"></dd></div>
      <div class="metric"><dt data-i18n="metric_first_token"></dt><dd id="metricFirstToken"></dd></div>
    </dl>
  </section>
  <section>
    <h2 class="label" data-i18n="calls_title"></h2>
    <ul class="calls" id="calls"></ul>
    <p class="empty" id="callsEmpty" data-i18n="calls_empty"></p>
  </section>
</aside>

<main class="panel center">
  <section class="sheet" id="toolSheet" hidden>
    <h2 class="label" data-i18n="tools_title"></h2>
    <ul id="toolList"></ul>
    <p class="empty" id="toolsEmpty" data-i18n="tools_empty"></p>
  </section>
  <button class="btn" id="pairRenew" type="button" data-i18n="pair_renew" hidden></button>
  <form class="token-box" id="tokenBox" hidden>
    <label for="tokenInput" data-i18n="token_label"></label>
    <input class="input" id="tokenInput" type="password" autocomplete="off">
    <button class="btn" id="tokenSend" type="submit" data-i18n="token_send"></button>
    <p data-i18n="token_hint"></p>
  </form>
  <p class="dropped" id="dropped" hidden></p>
  <div class="stream" id="stream" role="log" tabindex="0" data-i18n="stream_label" data-i18n-attr="aria-label"></div>
  <p class="stream-empty" id="streamEmpty" data-i18n="stream_empty"></p>
  <button class="btn btn-small jump" id="jump" type="button" data-i18n="jump_latest" hidden></button>
  <section class="approvals" id="approvals" aria-live="assertive" data-i18n="approvals_label" data-i18n-attr="aria-label"></section>
  <div class="composer">
    <input class="input" id="composer" type="text" autocomplete="off" data-i18n="composer_placeholder" data-i18n-attr="placeholder">
    <button class="btn" id="send" type="button" data-i18n="button_send"></button>
    <button class="btn" id="stop" type="button" data-i18n="button_stop"></button>
  </div>
</main>

<aside class="panel right" id="right" data-state="offline">
  <div class="ring-box">
    <svg class="ring" id="ring" viewBox="0 0 200 200" data-state="offline" aria-hidden="true">
      <circle class="r-base" cx="100" cy="100" r="96"/>
      <circle class="r-seg" cx="100" cy="100" r="86" pathLength="360"/>
      <g data-for="idle">
        <circle cx="100" cy="100" r="58"/>
        <circle class="r-fill" cx="100" cy="100" r="6"/>
      </g>
      <g data-for="loading">
        <circle class="r-track" cx="100" cy="100" r="62"/>
        <circle class="r-arc" id="ringProgress" cx="100" cy="100" r="62" pathLength="100"/>
      </g>
      <g data-for="listening">
        <rect class="r-bar" x="68" y="82" width="8" height="36" rx="4"/>
        <rect class="r-bar" x="82" y="66" width="8" height="68" rx="4"/>
        <rect class="r-bar" x="96" y="54" width="8" height="92" rx="4"/>
        <rect class="r-bar" x="110" y="66" width="8" height="68" rx="4"/>
        <rect class="r-bar" x="124" y="82" width="8" height="36" rx="4"/>
      </g>
      <g data-for="thinking">
        <circle class="r-orbit-a" cx="100" cy="100" r="62"/>
        <circle class="r-orbit-b" cx="100" cy="100" r="44"/>
        <circle class="r-fill" cx="100" cy="100" r="4"/>
      </g>
      <g data-for="speaking">
        <circle class="r-wave" cx="100" cy="100" r="70"/>
        <circle class="r-wave" cx="100" cy="100" r="70"/>
        <circle class="r-wave" cx="100" cy="100" r="70"/>
        <circle class="r-fill" cx="100" cy="100" r="12"/>
      </g>
      <g data-for="error">
        <path d="M100 42 L156 138 L44 138 Z"/>
        <rect class="r-fill" x="96" y="74" width="8" height="36" rx="3"/>
        <circle class="r-fill" cx="100" cy="122" r="5"/>
      </g>
      <g data-for="offline">
        <circle cx="100" cy="100" r="58" stroke-dasharray="6 10"/>
        <line x1="62" y1="62" x2="138" y2="138"/>
      </g>
    </svg>
    <p class="state-text" id="stateText" role="status"></p>
  </div>
  <div class="info">
    <p><span class="label" data-i18n="label_connection"></span><span id="connText"></span></p>
    <p><span class="label" data-i18n="label_model"></span><span id="modelText"></span></p>
  </div>
  <div class="switches">
    <button class="btn switch" id="micButton" type="button" aria-pressed="false"><span data-i18n="button_mic"></span><span class="switch-value" id="micValue"></span></button>
    <button class="btn switch" id="toolsButton" type="button" aria-pressed="false"><span data-i18n="button_tools"></span><span class="switch-value" id="toolsValue"></span></button>
    <button class="btn switch" id="focusButton" type="button" aria-pressed="false"><span data-i18n="button_focus"></span><span class="switch-value" id="focusValue"></span></button>
  </div>
  <div class="switches" id="setupBox" hidden>
    <label for="speechLanguage" data-i18n="label_speech_language"></label>
    <select id="speechLanguage"></select>
    <button class="btn" id="loadButton" type="button" data-i18n="button_load"></button>
  </div>
</aside>

<script>
// @ts-check
"use strict";
(() => {
  /** Ekranda görünen ad: yalnız burada yazılır. */
  const ASSISTANT_NAME = "Asistan";

  /**
   * Eşleme kodu (contract.md, "Kaynak"; dil tanımı 28.2b): Dost tarayıcıyı `#p=<kod>` ile açar. Kod yalnız bu biçimle
   * okunur ve her şeyden önce adresten silinir; değer DOM'a, metne, günlüğe girmez. Başka parça yok sayılır.
   */
  const PAIR_CODE = (() => {
    const match = /^#p=([A-Za-z0-9_-]{43})$/.exec(location.hash);
    if (location.hash !== "") history.replaceState(null, "", location.pathname);
    return match ? match[1] : "";
  })();

  const PROTOCOL_VERSION = 2;
  const MAX_EVENT_BYTES = 1024 * 1024; // contract.md: bir olayın sınırı
  const MAX_ROWS = 400; // akışta en çok satır: uzun oturum sekmeyi doldurmaz
  const MAX_TEXT_CHARS = 120000; // bir konuşma satırında en çok karakter
  const MAX_OUTPUT_CHARS = 24000; // bir araç çıktısından gösterilen en çok karakter
  const MAX_RECENT_CALLS = 8;
  const MAX_VALUE_CHARS = 200; // hata değerinin ekranda en uzun hali
  const RETRY_LIMIT_MS = 10000;
  const APPROVE_ARM_MS = 500; // kart açılınca Onayla bu kadar kapalı kalır: kör tıklama onaylamaz
  const STATES = ["setup", "idle", "loading", "listening", "thinking", "speaking", "error"];
  const RESULTS = ["ok", "error", "denied", "stopped"];
  const RESULT_MARKS = { running: "…", ok: "✓", error: "✕", denied: "⊘", stopped: "■" };
  const LANGUAGE_KEY = "assistant.language";

  /** @param {string} id @returns {any} */
  const byId = (id) => document.getElementById(id);
  /** @param {unknown} v */
  const str = (v) => (typeof v === "string" ? v : "");
  /** @param {unknown} v */
  const num = (v) => (typeof v === "number" && Number.isFinite(v) ? v : null);

  /**
   * Denetim, yön ve görünmez karakterleri kod noktasıyla yazar. Kartın ve araç adının gösterdiği metin okunanla aynı
   * olmalı: U+202E bir dosya adını ters gösterebilir, onay da yanlış şeye verilir.
   * @param {string} text
   */
  const visible = (text) => text.replace(
    /[\u0000-\u0008\u000b-\u001f\u007f-\u009f\u00ad\u061c\u200b-\u200f\u2028-\u202e\u2060-\u206f\ufeff]/g,
    (c) => `[U+${c.charCodeAt(0).toString(16).toUpperCase().padStart(4, "0")}]`);

  // ---------- Dil ----------

  /**
   * Dil dosyaları burayı doldurur (`lang/<kod>.js`). Bu betikten sonra yüklenirler; ekran sayfa hazır olunca başlar.
   * @type {Record<string, Record<string, string>>}
   */
  const dictionary = {};
  /** @type {any} */ (window).assistantLanguages = dictionary;
  let languages = /** @type {string[]} */ ([]);
  /** @type {WeakMap<Element, Record<string, unknown>>} */
  const boundValues = new WeakMap();

  function savedLanguage() {
    try {
      return localStorage.getItem(LANGUAGE_KEY);
    } catch {
      return null;
    }
  }

  /** @param {string} value */
  function saveLanguage(value) {
    try {
      localStorage.setItem(LANGUAGE_KEY, value);
    } catch {
      // Tercih yalnız bu oturumda kalır.
    }
  }

  /** Seçim hatırlanır; yoksa tarayıcının dili; o da yoksa listedeki ilk dil. Hiç dil yüklenmediyse dil belirsizdir. */
  function pickLanguage() {
    const saved = savedLanguage();
    if (saved && dictionary[saved]) return saved;
    for (const tag of navigator.languages || []) {
      const base = tag.toLowerCase().split("-")[0];
      if (dictionary[base]) return base;
    }
    return languages[0] || "und";
  }

  let language = "und";

  /** @param {number} value @param {string} unit @param {number} digits */
  function unitFormat(value, unit, digits) {
    return new Intl.NumberFormat(language, { style: "unit", unit, maximumFractionDigits: digits }).format(value);
  }

  /** @param {number} ms */
  function formatDuration(ms) {
    return ms < 1000 ? unitFormat(ms, "millisecond", 0) : unitFormat(ms / 1000, "second", 1);
  }

  /** @param {number} bytes */
  function formatBytes(bytes) {
    if (bytes >= 1e9) return unitFormat(bytes / 1e9, "gigabyte", 2);
    if (bytes >= 1e6) return unitFormat(bytes / 1e6, "megabyte", 1);
    if (bytes >= 1e3) return unitFormat(bytes / 1e3, "kilobyte", 1);
    return unitFormat(bytes, "byte", 0);
  }

  /** Sözleşme: `_ms` süre, `_bytes` boyuttur; öbür sayılar dile göre yazılır. @param {string} name @param {unknown} value */
  function formatValue(name, value) {
    if (typeof value === "number") {
      if (name.endsWith("_ms")) return formatDuration(value);
      if (name.endsWith("_bytes")) return formatBytes(value);
      return new Intl.NumberFormat(language).format(value);
    }
    return String(value).slice(0, MAX_VALUE_CHARS);
  }

  /** @param {string} key @param {Record<string, unknown>} [values] */
  function t(key, values) {
    const text = (dictionary[language] || {})[key];
    if (text === undefined) return key;
    return text.replace(/\{(\w+)\}/g, (whole, name) =>
      values && Object.hasOwn(values, name) ? formatValue(name, values[name]) : whole);
  }

  /** @param {HTMLElement} node */
  function paint(node) {
    const key = node.dataset.i18n || "";
    const text = t(key, boundValues.get(node));
    const attr = node.dataset.i18nAttr;
    if (attr) node.setAttribute(attr, text);
    else node.textContent = text;
  }

  /**
   * Düğüm dile bağlanır: dil değişince kendi kendine yeniden yazılır.
   * @template {HTMLElement} T
   * @param {T} node @param {string} key @param {Record<string, unknown>} [values] @returns {T}
   */
  function bind(node, key, values) {
    node.dataset.i18n = key;
    if (values) boundValues.set(node, values);
    paint(node);
    return node;
  }

  /** @param {string} tag @param {string} [className] @param {string} [text] */
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  // ---------- Ekranın durumu ----------

  const ui = {
    state: "idle",
    mic: false,
    progress: /** @type {number|null} */ (null),
    conn: "connecting", // connecting, open, reconnecting, auth, forbidden, rejected, mismatch, pair_invalid, pair_used, lost
    connValues: /** @type {Record<string, unknown>} */ ({}),
    model: "",
    tools: /** @type {{name: string, irreversible: boolean}[]} */ ([]),
    activeTurn: "",
    lastId: /** @type {string|null} */ (null),
    heartbeatMs: 15000,
    metrics: /** @type {Record<string, unknown>} */ ({}),
    settings: /** @type {Record<string, unknown>} */ ({}),
    calls: /** @type {{tool: string, result: string, duration_ms: number|null}[]} */ ([]),
    droppedRows: 0,
    filter: "",
    token: "",
  };

  /**
   * Belirteç sekmenin oturum belleğinde (contract.md): anahtar kapıya bağlı, içinde yalnız belirteç; kalıcı depoya
   * (`localStorage`, çerez) yazılmaz; `401`'de ve sürüm uyuşmazlığında silinir. Depo kapalıysa belirteç bellekte kalır.
   */
  const TOKEN_KEY = `dost-token-${location.port}`;
  function loadToken() {
    try {
      return sessionStorage.getItem(TOKEN_KEY) || "";
    } catch {
      return "";
    }
  }
  /** @param {string} token */
  function saveToken(token) {
    ui.token = token;
    try {
      sessionStorage.setItem(TOKEN_KEY, token);
    } catch {
      // depo kapalı: belirteç yalnız bellekte
    }
  }
  function dropToken() {
    ui.token = "";
    try {
      sessionStorage.removeItem(TOKEN_KEY);
    } catch {
      // depo kapalı
    }
  }

  const stream = byId("stream");
  const composer = byId("composer");
  const cardsBox = byId("approvals");
  /** @type {Map<string, any>} */
  const turns = new Map();
  /** @type {Map<string, any>} */
  const toolRows = new Map();
  /** @type {Map<string, any>} */
  const cards = new Map();

  const connected = () => ui.conn === "open";

  // ---------- Akış satırları ----------

  let stick = true;
  let followPending = false;

  function follow() {
    if (!stick) {
      byId("jump").hidden = false;
      return;
    }
    if (followPending) return;
    followPending = true;
    requestAnimationFrame(() => {
      followPending = false;
      stream.scrollTop = stream.scrollHeight;
    });
  }

  /** @param {HTMLElement} row */
  function matchesFilter(row) {
    return !ui.filter || (row.textContent || "").toLocaleLowerCase(language).includes(ui.filter);
  }

  function renderSearchCount() {
    const count = byId("searchCount");
    count.hidden = !ui.filter;
    if (!ui.filter) return;
    const rows = Array.from(stream.children);
    const shown = rows.filter((row) => !(/** @type {HTMLElement} */ (row).hidden)).length;
    bind(count, "search_count", { shown, total: rows.length });
  }

  function applyFilter() {
    for (const row of stream.children) {
      const item = /** @type {HTMLElement} */ (row);
      item.hidden = !matchesFilter(item);
    }
    renderSearchCount();
  }

  /** @param {HTMLElement} row */
  function addRow(row) {
    stream.append(row);
    row.hidden = !matchesFilter(row);
    while (stream.childElementCount > MAX_ROWS) {
      stream.firstElementChild.remove();
      ui.droppedRows += 1;
    }
    const dropped = byId("dropped");
    dropped.hidden = ui.droppedRows === 0;
    if (ui.droppedRows > 0) bind(dropped, "rows_dropped", { count: ui.droppedRows });
    byId("streamEmpty").hidden = true;
    if (ui.filter) renderSearchCount();
    follow();
  }

  /** @param {string} key @param {Record<string, unknown>} [values] @param {string} [kind] */
  function note(key, values, kind) {
    const row = el("div", "row note");
    if (kind) row.classList.add(`notice-${kind}`);
    addRow(bind(row, key, values));
  }

  /** @param {any} error */
  function errorKey(error) {
    const code = str(error && error.code);
    const key = `error_${code}`;
    return t(key) !== key ? { key, values: (error && error.values) || {} } : { key: "error_unknown", values: { code } };
  }

  /** @param {any} error */
  function noteError(error) {
    const { key, values } = errorKey(error);
    note(key, values, "error");
  }

  function clearStream() {
    stream.replaceChildren();
    turns.clear();
    toolRows.clear();
    ui.droppedRows = 0;
    ui.calls = [];
    ui.activeTurn = "";
    byId("dropped").hidden = true;
    byId("streamEmpty").hidden = false;
    renderCalls();
    if (ui.filter) renderSearchCount();
  }

  /** @param {string} id @param {string} [source] */
  function turnOf(id, source) {
    let turn = turns.get(id);
    if (!turn) {
      turn = { source: source || "text", user: null, assistant: null };
      turns.set(id, turn);
    }
    return turn;
  }

  /** @param {any} turn @param {string} role */
  function messageOf(turn, role) {
    if (turn[role]) return turn[role];
    const row = el("article", `row msg ${role}`);
    const head = el("div", "msg-head");
    if (role === "user") {
      head.append(bind(el("span"), "speaker_user"));
      if (turn.source === "voice") head.append(" · ", bind(el("span"), "source_voice"));
    } else {
      head.textContent = ASSISTANT_NAME;
    }
    const body = el("div", "msg-text");
    body.dir = "auto";
    const textNode = document.createTextNode("");
    body.append(textNode);
    row.append(head, body);
    if (role === "assistant") row.classList.add("streaming");
    addRow(row);
    turn[role] = { row, textNode, length: 0, cut: 0, cutNote: null };
    return turn[role];
  }

  /** Ekran sınırını aşan metin kesilir ve söylenir. @param {any} msg @param {string} text @param {boolean} replace */
  function writeText(msg, text, replace) {
    if (replace) {
      msg.textNode.data = "";
      msg.length = 0;
      msg.cut = 0;
    }
    const room = MAX_TEXT_CHARS - msg.length;
    const part = text.length > room ? text.slice(0, Math.max(room, 0)) : text;
    msg.textNode.appendData(part);
    msg.length += part.length;
    msg.cut += text.length - part.length;
    if (msg.cut > 0) {
      if (!msg.cutNote) {
        msg.cutNote = el("p", "text-cut");
        msg.row.append(msg.cutNote);
      }
      bind(msg.cutNote, "text_cut", { count: msg.cut });
    } else if (msg.cutNote) {
      msg.cutNote.remove();
      msg.cutNote = null;
    }
    follow();
  }

  /** @param {any} turn */
  function closeAssistant(turn) {
    if (turn.assistant) turn.assistant.row.classList.remove("streaming");
    turn.assistant = null;
  }

  /** @param {string} tool @param {string} result @param {number|null} ms */
  function rememberCall(tool, result, ms) {
    ui.calls.unshift({ tool, result, duration_ms: ms });
    ui.calls.length = Math.min(ui.calls.length, MAX_RECENT_CALLS);
    renderCalls();
  }

  function renderCalls() {
    const list = byId("calls");
    list.replaceChildren(...ui.calls.map((call) => {
      const item = el("li");
      const info = el("span", "call-info");
      bind(info, `result_${call.result}`);
      item.append(el("span", "call-name", `${RESULT_MARKS[call.result]} ${call.tool}`), info);
      if (call.duration_ms !== null) {
        item.append(" · ", bind(el("span", "call-info"), "duration_value", { duration_ms: call.duration_ms }));
      }
      return item;
    }));
    byId("callsEmpty").hidden = ui.calls.length > 0;
  }

  /** @param {string} id @param {string} tool */
  function toolRowOf(id, tool) {
    let entry = toolRows.get(id);
    if (entry) return entry;
    const row = el("div", "row tool");
    const mark = el("span", "tool-mark", RESULT_MARKS.running);
    mark.setAttribute("aria-hidden", "true");
    const name = el("span", "tool-name", tool);
    const result = bind(el("span", "tool-result"), "result_running");
    const time = el("span", "tool-time");
    row.append(mark, name, result, time);
    row.dataset.result = "running";
    addRow(row);
    entry = { row, mark, result, time, tool };
    toolRows.set(id, entry);
    return entry;
  }

  /** @param {any} entry @param {string} output @param {any} d */
  function addOutput(entry, output, d) {
    const box = /** @type {HTMLDetailsElement} */ (el("details", "out"));
    const summary = bind(el("summary"), "tool_output");
    const pre = el("pre", "", output.slice(0, MAX_OUTPUT_CHARS));
    pre.dir = "auto";
    box.append(summary, pre);
    if (output.length > MAX_OUTPUT_CHARS) {
      box.append(bind(el("p", "notice-warn"), "tool_display_cut"));
    }
    if (d.truncated === true) {
      const total = num(d.output_bytes) ?? output.length;
      box.append(bind(el("p", "notice-warn"), "tool_truncated", { shown_bytes: new TextEncoder().encode(output).length, total_bytes: total }));
    }
    entry.row.append(box);
  }

  // ---------- Onay kartları ----------

  /** @param {any} card */
  function refreshCard(card) {
    const left = Math.max(0, Math.ceil((card.expiresAt - Date.now()) / 1000));
    const timed = Number.isFinite(card.expiresAt);
    card.time.hidden = !timed;
    if (timed) {
      if (left > 0) bind(card.time, "approval_time_left", { seconds: left });
      else bind(card.time, "approval_time_up");
    }
    const usable = connected() && !card.busy;
    card.deny.disabled = !usable;
    card.approve.disabled = !usable || !card.armed || (timed && left === 0);
    card.status.hidden = connected() && !card.busy && !card.error;
    if (!connected()) bind(card.status, "approval_offline");
    else if (card.busy) bind(card.status, "approval_sent");
    else if (card.error) bind(card.status, card.error.key, card.error.values);
  }

  function refreshCards() {
    for (const card of cards.values()) refreshCard(card);
  }

  /** @param {any} card @param {string} decision */
  async function answerCard(card, decision) {
    if (card.busy || !connected()) return;
    // Düğme kapanınca tarayıcı odağı bırakır: kart kalkınca odağın nereye döneceği şimdiden bilinmeli.
    card.hadFocus = card.root.contains(document.activeElement);
    card.busy = true;
    card.error = null;
    card.answered = true;
    refreshCard(card);
    // Aynı karar aynı kimlikle yinelenir: kopan bağlantıda iş iki kez yapılmaz.
    card.commands[decision] = card.commands[decision] || newId();
    const reply = await sendCommand("approval_answer", { approval_id: card.id, decision }, card.commands[decision]);
    if (reply.ok || !cards.has(card.id)) return;
    card.busy = false;
    card.answered = false;
    card.error = errorKey(reply.error);
    refreshCard(card);
    if (card.hadFocus) card.deny.focus();
  }

  /** @param {any} d */
  function openCard(d) {
    const id = str(d.approval_id);
    if (!id || cards.has(id)) return;
    const root = el("section", "card");
    root.setAttribute("role", "group");
    const title = bind(el("h2", "card-title"), "approval_title");
    title.id = `approval-title-${cards.size}-${Date.now()}`;
    root.setAttribute("aria-labelledby", title.id);
    const time = el("span", "card-time");
    const head = el("div", "card-head");
    head.append(title, time);
    const args = el("pre", "card-args", visible(str(d.args)));
    args.dir = "ltr";
    args.tabIndex = 0;
    const tool = visible(str(d.tool));
    root.append(head, bind(el("p", "card-field"), "approval_tool"), el("div", "card-tool", tool),
      bind(el("p", "card-field"), "approval_args"), args);
    if (d.args_truncated === true) {
      const shown = new TextEncoder().encode(str(d.args)).length;
      root.append(bind(el("p", "card-note"), "approval_truncated", { shown_bytes: shown, total_bytes: num(d.args_bytes) ?? shown }));
    }
    const status = el("p", "card-note");
    const deny = /** @type {HTMLButtonElement} */ (bind(el("button", "btn btn-deny"), "approval_deny"));
    const approve = /** @type {HTMLButtonElement} */ (bind(el("button", "btn btn-approve"), "approval_approve"));
    deny.type = "button";
    approve.type = "button";
    const actions = el("div", "card-actions");
    actions.append(deny, approve);
    root.append(status, actions);

    const card = {
      id, tool, root, time, status, deny, approve,
      expiresAt: Date.parse(str(d.expires_at)),
      armed: false, busy: false, answered: false, hadFocus: false, error: null,
      commands: /** @type {Record<string, string>} */ ({}),
    };
    cards.set(id, card);
    cardsBox.append(root);
    deny.addEventListener("click", () => answerCard(card, "deny"));
    approve.addEventListener("click", () => answerCard(card, "approve"));
    root.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        event.stopPropagation();
        answerCard(card, "deny");
      }
    });
    setTimeout(() => {
      card.armed = true;
      refreshCard(card);
    }, APPROVE_ARM_MS);
    refreshCard(card);
    // Yazı yazarken odak çalınmaz: boşluk tuşu istemeden kartı kapatmasın.
    const active = document.activeElement;
    const typing = (active === composer || active === byId("search")) && /** @type {HTMLInputElement} */ (active).value !== "";
    if (!typing) deny.focus();
  }

  /** @param {any} card */
  function removeCard(card) {
    const hadFocus = card.hadFocus || card.root.contains(document.activeElement);
    cards.delete(card.id);
    card.root.remove();
    if (!hadFocus) return;
    const next = cards.values().next().value;
    if (next) next.deny.focus();
    else composer.focus();
  }

  // ---------- Olaylar ----------

  /** @type {Map<string, (data: any) => void>} */
  const handlers = new Map();
  /** @param {string} type @param {(data: any) => void} fn */
  const on = (type, fn) => handlers.set(type, fn);

  on("session", (d) => {
    const lost = new Map(cards);
    const snapshot = Array.isArray(d.snapshot) ? d.snapshot : [];
    for (const item of snapshot) {
      if (item && item.type === "approval_open" && item.data) lost.delete(str(item.data.approval_id));
    }
    for (const card of lost.values()) removeCard(card);
    clearStream();
    ui.model = str(d.model);
    ui.tools = (Array.isArray(d.tools) ? d.tools : []).map((tool) => ({ name: str(tool && tool.name), irreversible: Boolean(tool && tool.irreversible) }));
    ui.heartbeatMs = num(d.heartbeat_ms) ?? ui.heartbeatMs;
    ui.metrics = {};
    renderMetrics();
    renderTools();
    for (const item of snapshot) {
      const handler = item && item.type !== "session" ? handlers.get(item.type) : undefined;
      if (handler) handler(item.data || {});
    }
    for (const card of lost.values()) note("approval_lost", { tool: card.tool }, "warn");
    renderStatus();
  });

  on("settings", (d) => {
    ui.settings = d;
    renderSetup();
  });

  on("state", (d) => {
    if (STATES.includes(d.state)) ui.state = d.state;
    ui.mic = d.mic === true;
    ui.progress = num(d.progress);
    renderStatus();
  });

  on("turn_start", (d) => {
    const id = str(d.turn_id);
    turnOf(id, str(d.source));
    ui.activeTurn = id;
    renderControls();
  });

  on("turn_text", (d) => {
    const role = d.role === "user" ? "user" : "assistant";
    const turn = turnOf(str(d.turn_id));
    const msg = messageOf(turn, role);
    writeText(msg, str(d.text), d.mode === "replace");
    if (role === "user") msg.row.classList.toggle("draft", d.final === false);
  });

  on("turn_end", (d) => {
    const id = str(d.turn_id);
    const turn = turns.get(id);
    if (turn) {
      closeAssistant(turn);
      turns.delete(id);
    }
    if (ui.activeTurn === id) ui.activeTurn = "";
    if (d.reason === "stopped") note("reason_stopped");
    if (d.reason === "error") {
      if (d.error) noteError(d.error);
      else note("reason_error", undefined, "error");
    }
    renderControls();
  });

  on("tool_start", (d) => {
    const turn = turns.get(str(d.turn_id));
    if (turn) closeAssistant(turn); // araçtan sonraki cevap satırı aracın altına düşer
    toolRowOf(str(d.call_id), visible(str(d.tool)));
  });

  on("tool_end", (d) => {
    const id = str(d.call_id);
    const entry = toolRowOf(id, visible(str(d.tool)));
    const result = RESULTS.includes(d.result) ? d.result : "error";
    entry.row.dataset.result = result;
    entry.mark.textContent = RESULT_MARKS[result];
    bind(entry.result, `result_${result}`);
    const ms = num(d.duration_ms);
    if (ms !== null) bind(entry.time, "duration_value", { duration_ms: ms });
    const output = str(d.output);
    if (output || d.truncated === true) addOutput(entry, output, d);
    if (d.error) noteError(d.error);
    toolRows.delete(id);
    rememberCall(entry.tool, result, ms);
    follow();
  });

  on("approval_open", (d) => {
    const entry = toolRows.get(str(d.call_id));
    if (entry) bind(entry.result, "result_waiting"); // onaylanmayan araç çalışmıyor: satır bunu söyler
    openCard(d);
  });

  on("approval_close", (d) => {
    const card = cards.get(str(d.approval_id));
    if (!card) return;
    removeCard(card);
    const values = { tool: card.tool };
    if (d.reason === "answered") {
      const who = card.answered ? "" : "other_";
      note(`approval_closed_${who}${d.decision === "approve" ? "approved" : "denied"}`, values);
    } else if (d.reason === "expired" || d.reason === "stopped") {
      note(`approval_closed_${d.reason}`, values, "warn");
    }
  });

  on("metrics", (d) => {
    Object.assign(ui.metrics, d);
    renderMetrics();
  });

  on("error", (d) => {
    noteError(d);
    if (d.fatal === true) {
      ui.state = "error";
      renderStatus();
    }
  });

  on("heartbeat", () => {});

  /** @param {{id: string, data: string}} frame */
  function receive(frame) {
    let event;
    try {
      event = JSON.parse(frame.data);
    } catch {
      noteError({ code: "bad_event" });
      return;
    }
    if (!event || typeof event !== "object") {
      noteError({ code: "bad_event" });
      return;
    }
    if (event.v !== PROTOCOL_VERSION) {
      dropToken();
      client.refuse("mismatch", { got: String(event.v), want: PROTOCOL_VERSION });
      return;
    }
    if (event.type === "heartbeat") return;
    const step = eventStep(ui.lastId, frame.id, event.type);
    ui.lastId = step.lastId;
    if (step.reconnect) client.retry();
    if (!step.apply) return;
    const handler = handlers.get(event.type);
    if (handler) handler(event.data && typeof event.data === "object" ? event.data : {});
  }

  // ---------- Olay kimliği ----------
  // splitId ve eventStep saf fonksiyondur; Go testi (TestEventIdOrder) bu iki işaretin arasını node ile koşar.

  /**
   * Kimlik `<ön ek>-<sıra>` metnidir (contract.md, "Kopma ve yeniden bağlanma"): olduğu gibi saklanır ve geri
   * gönderilir, ön ek üretilmez; karşılaştırmada yalnız son tireden sonraki sıra sayıdır.
   * @param {string} id @returns {{prefix: string, seq: bigint}|null}
   */
  function splitId(id) {
    const dash = id.lastIndexOf("-");
    const digits = id.slice(dash + 1);
    if (dash <= 0 || !/^[0-9]{1,19}$/.test(digits)) return null;
    return { prefix: id.slice(0, dash), seq: BigInt(digits) };
  }

  /**
   * Bir olayın kimliğine göre: uygulanır mı, son kimlik ne olur, bağlantı yenilenir mi. `session` hiç atılmaz ve son
   * kimliği kendi kimliğine kurar (ön eki farklı, sırası küçük olsa da). Öbür olay son kimlikle aynı ön eki ve daha
   * büyük sırayı taşımalıdır: sırası büyük değilse atılır; ön eki farklıysa ya da son kimlik yoksa (ilk olay `session`
   * değil) uygulanmaz, son kimlik silinir ve ekran `Last-Event-ID`'siz yeniden bağlanır.
   * @param {string|null} lastId @param {string} id @param {string} type
   * @returns {{apply: boolean, lastId: string|null, reconnect: boolean}}
   */
  function eventStep(lastId, id, type) {
    if (type === "session") return { apply: true, lastId: id, reconnect: false };
    const last = lastId === null ? null : splitId(lastId);
    const next = splitId(id);
    if (last === null || next === null || next.prefix !== last.prefix) return { apply: false, lastId: null, reconnect: true };
    if (next.seq <= last.seq) return { apply: false, lastId, reconnect: false };
    return { apply: true, lastId: id, reconnect: false };
  }
  // ---------- Olay kimliği sonu ----------

  // ---------- SSE ----------

  /** @param {(frame: {id: string, data: string}) => void} onFrame @param {() => void} onOverflow */
  function createParser(onFrame, onOverflow) {
    const decoder = new TextDecoder("utf-8");
    let buffer = "";
    let id = "";
    let data = /** @type {string[]} */ ([]);
    let size = 0;
    /** @param {string} line */
    function field(line) {
      if (line === "") {
        if (data.length > 0) onFrame({ id, data: data.join("\n") });
        id = "";
        data = [];
        size = 0;
        return;
      }
      if (line.startsWith(":")) return;
      const colon = line.indexOf(":");
      const name = colon < 0 ? line : line.slice(0, colon);
      const value = colon < 0 ? "" : line.slice(colon + 1).replace(/^ /, "");
      if (name === "id") id = value;
      if (name === "data") {
        data.push(value);
        size += value.length;
      }
    }
    return {
      /** @param {Uint8Array} bytes */
      push(bytes) {
        buffer += decoder.decode(bytes, { stream: true });
        const breaks = /\r\n|\n|\r(?!$)/g;
        let start = 0;
        let match;
        while ((match = breaks.exec(buffer)) !== null) {
          field(buffer.slice(start, match.index));
          start = breaks.lastIndex;
        }
        buffer = buffer.slice(start);
        if (buffer.length + size > MAX_EVENT_BYTES) onOverflow();
      },
    };
  }

  // ---------- Taşıyıcılar ----------

  /**
   * Gerçek kaynak. `EventSource` üstbilgi taşıyamaz, belirteç URL'ye yazılmaz: akış `fetch` ile okunur.
   * @param {string} base
   */
  function fetchTransport(base) {
    const headers = () => {
      /** @type {Record<string, string>} */
      const list = {};
      if (ui.token) list.Authorization = `Bearer ${ui.token}`;
      return list;
    };
    const options = { cache: /** @type {RequestCache} */ ("no-store"), credentials: /** @type {RequestCredentials} */ ("omit"), referrerPolicy: /** @type {ReferrerPolicy} */ ("no-referrer") };
    return {
      /** @param {string|null} lastId @param {any} sink */
      open(lastId, sink) {
        const abort = new AbortController();
        (async () => {
          try {
            const list = { ...headers(), Accept: "text/event-stream" };
            if (lastId !== null) list["Last-Event-ID"] = lastId;
            const response = await fetch(`${base}/events`, { ...options, headers: list, signal: abort.signal });
            if (!response.ok || !response.body) {
              sink.closed(response.status);
              return;
            }
            sink.opened();
            const reader = response.body.getReader();
            for (;;) {
              const { done, value } = await reader.read();
              if (done) break;
              sink.chunk(value);
            }
            sink.closed(0);
          } catch {
            if (!abort.signal.aborted) sink.closed(0);
          }
        })();
        return { cancel: () => abort.abort() };
      },
      /** @param {string} body */
      async post(body) {
        const response = await fetch(`${base}/command`, {
          ...options,
          method: "POST",
          headers: { ...headers(), "Content-Type": "application/json" },
          body,
        });
        let json = null;
        try {
          json = await response.json();
        } catch {
          json = null;
        }
        return { status: response.status, json };
      },
    };
  }

  /**
   * Sahte kaynak: gerçek sunucuyla aynı baytları üretir, aynı ayrıştırıcıdan geçer. Ekran kodu ikisini ayırmaz;
   * yalnız üstteki sahne seçicisi `scenes` alanına bakar.
   */
  function createMockTransport() {
    const HEARTBEAT_MS = 2000;
    const CANCELLED = Symbol("cancelled");
    const encoder = new TextEncoder();
    let sessionNumber = 1;
    let prefix = newId(); // yayıncının ön eki: sunucu her açılışta yeniden üretir
    let seq = 0;
    let frames = /** @type {{seq: number, text: string}[]} */ ([]);
    let log = /** @type {{type: string, data: any}[]} */ ([]);
    let sink = /** @type {any} */ (null);
    let heartbeatTimer = 0;
    let muted = false;
    let down = false;
    let runToken = 0;
    let turnCount = 0;
    let callCount = 0;
    let approvalCount = 0;
    let activeTurn = "";
    let runningCall = "";
    let current = { state: "idle", mic: false };
    let lastMetrics = /** @type {any} */ (null);
    /** @type {Map<string, {resolve: (value: string) => void}>} */
    const open = new Map();
    const closedApprovals = new Set();
    /** @type {Map<string, any>} */
    const answers = new Map();

    /** Çerçeve iki parçada gelir: ayrıştırıcı bölünmüş UTF-8'i de görsün. @param {string} text */
    function deliver(text) {
      if (!sink) return;
      const bytes = encoder.encode(text);
      const half = Math.floor(bytes.length / 2);
      sink.chunk(bytes.subarray(0, half));
      if (sink) sink.chunk(bytes.subarray(half));
    }

    /** @param {string} type @param {any} data */
    function remember(type, data) {
      if (type === "state") current = { state: data.state, mic: data.mic };
      if (type === "metrics") lastMetrics = data;
      if (["turn_start", "turn_text", "turn_end", "tool_start", "tool_end", "approval_open"].includes(type)) {
        log.push({ type, data });
        if (log.length > 1500) log.shift();
      }
      if (type === "approval_close") {
        log = log.filter((item) => !(item.type === "approval_open" && item.data.approval_id === data.approval_id));
      }
    }

    /** @param {string} type @param {any} [data] */
    function emit(type, data) {
      if (type === "heartbeat") {
        if (!muted) deliver(`data: ${JSON.stringify({ v: PROTOCOL_VERSION, type })}\n\n`);
        return;
      }
      if (type === "session") {
        // Görüntü saklanan bir olay değildir: kimliği son olayınkidir (olay yoksa `<ön ek>-0`).
        deliver(`id: ${prefix}-${seq}\ndata: ${JSON.stringify({ v: PROTOCOL_VERSION, type, data })}\n\n`);
        return;
      }
      seq += 1;
      const text = `id: ${prefix}-${seq}\ndata: ${JSON.stringify({ v: PROTOCOL_VERSION, type, data })}\n\n`;
      frames.push({ seq, text });
      if (frames.length > 4096) frames.shift();
      remember(type, data);
      deliver(text);
    }

    function sendSession() {
      const snapshot = [{ type: "state", data: current }, ...log];
      if (lastMetrics) snapshot.push({ type: "metrics", data: lastMetrics });
      emit("session", {
        session_id: `mock-${sessionNumber}`,
        server_version: "0.0.0-mock",
        model: t("mock_model"),
        tools: [
          { name: "example_read_note", irreversible: false },
          { name: "example_delete_file", irreversible: true },
        ],
        heartbeat_ms: HEARTBEAT_MS,
        snapshot,
      });
    }

    /** @param {any} s */
    function closeStream(s) {
      if (sink === s) sink = null;
      clearInterval(heartbeatTimer);
    }

    function drop() {
      const s = sink;
      closeStream(s);
      if (s) s.closed(0);
    }

    /** @param {string|null} lastId @param {any} s */
    function attach(lastId, s) {
      if (down) {
        s.closed(0);
        return;
      }
      muted = false;
      sink = s;
      s.opened();
      const asked = lastId === null ? null : splitId(lastId);
      const last = asked === null || asked.prefix !== prefix ? -1 : Number(asked.seq);
      const oldest = frames.length > 0 ? frames[0].seq - 1 : seq;
      if (last > 0 && last >= oldest && last <= seq) {
        for (const frame of frames) {
          if (frame.seq > last) deliver(frame.text);
        }
      } else {
        sendSession();
      }
      clearInterval(heartbeatTimer);
      heartbeatTimer = window.setInterval(() => emit("heartbeat"), HEARTBEAT_MS);
    }

    /** @param {string} state @param {any} [extra] */
    const setState = (state, extra) => emit("state", { state, mic: current.mic, ...extra });
    /** @type {Record<string, unknown>} */
    const mockSettings = { language_model: "mock-model", speech_language: "tr", system_prompt: { source: "catalog" }, context: 8192, device: "cpu", port: 47863, machine: { memory_bytes: 17179869184, memory_source: "option" } };

    /** @param {string} source */
    function newTurn(source) {
      turnCount += 1;
      activeTurn = `t-${turnCount}`;
      emit("turn_start", { turn_id: activeTurn, source });
    }

    /** @param {string} text */
    function userSays(text) {
      emit("turn_text", { turn_id: activeTurn, role: "user", mode: "replace", text, final: true });
    }

    /** @param {string} reason @param {any} [error] */
    function endTurn(reason, error) {
      if (!activeTurn) return;
      emit("turn_end", error ? { turn_id: activeTurn, reason, error } : { turn_id: activeTurn, reason });
      activeTurn = "";
    }

    /** @param {(ms: number) => Promise<void>} wait @param {string} text @param {number} [step] @param {number} [pause] */
    async function say(wait, text, step = 2, pause = 60) {
      const words = text.split(/(?<=\s)/);
      for (let i = 0; i < words.length; i += step) {
        emit("turn_text", { turn_id: activeTurn, role: "assistant", mode: "append", text: words.slice(i, i + step).join("") });
        await wait(pause);
      }
    }

    /** @param {string} tool */
    function startTool(tool) {
      callCount += 1;
      runningCall = `c-${callCount}`;
      emit("tool_start", { call_id: runningCall, turn_id: activeTurn, tool });
      return runningCall;
    }

    /** @param {string} result @param {number} ms @param {string} output @param {any} [extra] */
    function endTool(result, ms, output, extra) {
      const output_bytes = encoder.encode(output).length;
      emit("tool_end", { call_id: runningCall, result, duration_ms: ms, output, output_bytes, truncated: false, ...extra });
      runningCall = "";
    }

    /** @param {string} tool @param {string} args @param {number} seconds @param {any} [extra] @returns {Promise<string>} */
    function ask(tool, args, seconds, extra) {
      approvalCount += 1;
      const approval_id = `a-${approvalCount}`;
      startTool(tool);
      emit("approval_open", {
        approval_id,
        turn_id: activeTurn,
        call_id: runningCall,
        tool,
        args,
        args_bytes: encoder.encode(args).length,
        args_truncated: false,
        expires_at: new Date(Date.now() + seconds * 1000).toISOString(),
        ...extra,
      });
      setTimeout(() => closeApproval(approval_id, "expired"), seconds * 1000);
      return new Promise((resolve) => open.set(approval_id, { resolve }));
    }

    /** @param {string} id @param {string} reason @param {string} [decision] */
    function closeApproval(id, reason, decision) {
      const entry = open.get(id);
      if (!entry) return;
      open.delete(id);
      closedApprovals.add(id);
      emit("approval_close", decision ? { approval_id: id, reason, decision } : { approval_id: id, reason });
      entry.resolve(decision || reason);
    }

    /** Durdur: açık onaylar ve sürmekte olan iş kapanır. */
    function stopAll() {
      runToken += 1;
      for (const id of Array.from(open.keys())) closeApproval(id, "stopped");
      if (runningCall) endTool("stopped", 0, "");
      endTurn("stopped");
      setState("idle");
    }

    function publishMetrics() {
      emit("metrics", { memory_bytes: 2147483648 + (turnCount % 5) * 67108864, tokens_per_second: 9.5 + (turnCount % 4), first_token_ms: 640 + (turnCount % 3) * 90 });
    }

    /** @param {(ms: number) => Promise<void>} wait @param {string} question @param {number} seconds @param {any} [extra] */
    async function deleteTurn(wait, question, seconds, extra) {
      newTurn("text");
      userSays(question);
      setState("thinking");
      await wait(500);
      setState("speaking");
      await say(wait, t("mock_delete_intro"));
      setState("thinking");
      const args = JSON.stringify({ path: "/example/made-up-folder/made-up-file.txt" });
      return ask("example_delete_file", args, seconds, extra);
    }

    /** @param {(ms: number) => Promise<void>} wait @param {string} answer */
    async function finishDelete(wait, answer) {
      await wait(10);
      if (answer === "approve") {
        endTool("ok", 212, "");
        setState("speaking");
        await say(wait, t("mock_delete_done"));
      } else if (answer === "deny") {
        endTool("denied", 0, "");
        setState("speaking");
        await say(wait, t("mock_delete_denied"));
      } else {
        endTool(answer === "stopped" ? "stopped" : "denied", 0, "");
        setState("speaking");
        await say(wait, t("mock_delete_closed"));
      }
      endTurn("done");
      publishMetrics();
      setState("idle");
    }

    /** @type {Record<string, (wait: (ms: number) => Promise<void>, text?: string) => Promise<void>>} */
    const scenes = {
      async setup(wait) {
        current.mic = false;
        emit("settings", mockSettings);
        setState("setup");
        await wait(100);
      },
      async conversation(wait) {
        current.mic = true;
        setState("listening");
        await wait(500);
        newTurn("voice");
        for (const key of ["mock_draft_1", "mock_draft_2"]) {
          emit("turn_text", { turn_id: activeTurn, role: "user", mode: "replace", text: t(key), final: false });
          await wait(650);
        }
        userSays(t("mock_draft_3"));
        current.mic = false;
        setState("thinking");
        await wait(500);
        startTool("example_read_note");
        await wait(700);
        endTool("ok", 124, t("mock_tool_output"));
        setState("speaking");
        await say(wait, t("mock_answer"));
        endTurn("done");
        publishMetrics();
        setState("idle");
      },
      async loading(wait) {
        for (let step = 0; step <= 10; step += 1) {
          setState("loading", { progress: step / 10 });
          await wait(280);
        }
        setState("loading");
        await wait(1200);
        setState("idle");
      },
      async approval(wait) {
        await finishDelete(wait, await deleteTurn(wait, t("mock_question"), 30));
      },
      async approval_truncated(wait) {
        const args = JSON.stringify({ path: "/example/made-up-folder/", names: Array.from({ length: 300 }, (_, i) => `made-up-${i}.txt`) }).slice(0, 4096);
        await finishDelete(wait, await deleteTurn(wait, t("mock_question"), 30, { args, args_bytes: 1250000, args_truncated: true }));
      },
      async approval_hidden(wait) {
        const args = `{"path":"/example/made-up-\u202etxt.exe"}`;
        await finishDelete(wait, await deleteTurn(wait, t("mock_question"), 30, { args }));
      },
      async approval_expired(wait) {
        await finishDelete(wait, await deleteTurn(wait, t("mock_question"), 6));
      },
      async approval_stopped(wait) {
        deleteTurn(wait, t("mock_question"), 30).catch(() => {});
        await wait(4500);
        stopAll();
      },
      async approval_other_tab(wait) {
        const answer = deleteTurn(wait, t("mock_question"), 30);
        await wait(4500);
        for (const id of Array.from(open.keys())) closeApproval(id, "answered", "deny");
        await finishDelete(wait, await answer);
      },
      async stop(wait) {
        newTurn("text");
        userSays(t("mock_question"));
        setState("speaking");
        for (let i = 0; i < 400; i += 1) await say(wait, `${t("mock_stop_sentence")} `, 3, 70);
        endTurn("done");
        setState("idle");
      },
      async errors(wait) {
        newTurn("text");
        userSays(t("mock_question"));
        setState("thinking");
        await wait(400);
        startTool("example_delete_file");
        await wait(500);
        endTool("error", 37, "", { error: { code: "tool_failed", values: { tool: "example_delete_file" } } });
        await wait(300);
        endTurn("error", { code: "tool_timeout", values: { tool: "example_delete_file", limit_ms: 30000 } });
        emit("error", { code: "mic_unavailable", values: {}, fatal: false });
        emit("error", { code: "code_from_the_future", values: {}, fatal: false });
        await wait(500);
        emit("error", { code: "out_of_memory", values: { needed_bytes: 6442450944 }, fatal: true });
        setState("error");
        await wait(3500);
        setState("idle");
      },
      async disconnect(wait) {
        newTurn("text");
        userSays(t("mock_question"));
        setState("speaking");
        await say(wait, t("mock_drop_intro"));
        const answer = ask("example_delete_file", JSON.stringify({ path: "/example/made-up-file.txt" }), 40);
        await wait(1200);
        down = true;
        drop();
        await wait(1000);
        emit("turn_text", { turn_id: activeTurn, role: "assistant", mode: "append", text: t("mock_drop_rest") });
        await wait(2500);
        down = false;
        await finishDelete(wait, await answer);
      },
      async silent(wait) {
        muted = true;
        await wait(1);
      },
      async restart(wait) {
        deleteTurn(wait, t("mock_question"), 40).catch(() => {});
        await wait(3500);
        down = true;
        drop();
        await wait(1000);
        runToken += 1;
        open.clear();
        sessionNumber += 1;
        prefix = newId();
        seq = 0;
        frames = [];
        log = [];
        activeTurn = "";
        runningCall = "";
        lastMetrics = null;
        current = { state: "idle", mic: false };
        down = false;
      },
      async long_answer(wait) {
        newTurn("text");
        userSays(t("mock_question"));
        setState("speaking");
        const parts = [];
        for (let n = 1; n <= 2200; n += 1) parts.push(t("mock_long_sentence", { n }));
        await say(wait, parts.join(""), 300, 16);
        endTurn("done");
        publishMetrics();
        setState("idle");
      },
      async long_output(wait) {
        newTurn("text");
        userSays(t("mock_question"));
        setState("thinking");
        startTool("example_read_note");
        await wait(600);
        const lines = [];
        for (let n = 1; n <= 3000; n += 1) lines.push(t("mock_long_output", { n }));
        const output = lines.join("\n").slice(0, 40000); // her dilde 64 KiB altında
        endTool("ok", 2840, output, { output_bytes: 2500000, truncated: true });
        setState("speaking");
        await say(wait, t("mock_tool_output"));
        endTurn("done");
        setState("idle");
      },
      async hostile(wait) {
        newTurn("text");
        userSays("<b>made-up</b>");
        setState("speaking");
        const tag = "<" + "img src=x onerror=\"document.title='broken'\">";
        const script = "<" + "script>document.title='broken'<" + "/script>";
        const mixed = "\u202e" + "made-up" + "\u202c שלום مرحبا";
        await say(wait, `${tag}\n${script}\n${mixed}\n${t("mock_hostile_fake_card")}\n${"x".repeat(600)}\n`, 8, 30);
        startTool("<b>example_read_note</b>");
        await wait(300);
        endTool("ok", 1, `${tag}\n${script}\n`);
        setState("speaking");
        await say(wait, t("mock_hostile_note"));
        endTurn("done");
        setState("idle");
      },
      async bad_events(wait) {
        deliver("id: \ndata: {this is not json\n\n");
        await wait(300);
        emit("future_event", { anything: true });
        await wait(300);
        deliver(": a comment line\r\n\r\n");
        await wait(300);
        deliver(`data: ${"x".repeat(MAX_EVENT_BYTES + 16)}`);
      },
      async version() {
        deliver(`data: ${JSON.stringify({ v: PROTOCOL_VERSION + 1, type: "state", data: {} })}\n\n`);
      },
      /** Ekrandan gönderilen metin bu sahneye düşer; seçicide görünmez. */
      async reply(wait, text) {
        newTurn("text");
        userSays(text || "");
        setState("thinking");
        await wait(400);
        setState("speaking");
        await say(wait, t("mock_reply", { count: (text || "").length }));
        endTurn("done");
        publishMetrics();
        setState("idle");
      },
    };

    /** @param {string} name @param {string} [text] */
    function play(name, text) {
      if (activeTurn || open.size > 0) stopAll();
      runToken += 1;
      const token = runToken;
      down = false;
      /** @param {number} ms @returns {Promise<void>} */
      const wait = (ms) => new Promise((resolve, reject) => {
        setTimeout(() => (token === runToken ? resolve() : reject(CANCELLED)), ms);
      });
      scenes[name](wait, text).catch((reason) => {
        if (reason !== CANCELLED) throw reason;
      });
    }

    /** @param {any} command */
    function answer(command) {
      const accepted = { v: PROTOCOL_VERSION, command_id: command.command_id, status: "accepted" };
      /** @param {string} code @param {any} [values] */
      const rejected = (code, values) => ({ v: PROTOCOL_VERSION, command_id: command.command_id, status: "rejected", error: { code, values: values || {} } });
      const data = command.data || {};
      switch (command.type) {
        case "send_text":
          if (activeTurn) return rejected("turn_busy", { turn_id: activeTurn });
          if (encoder.encode(str(data.text)).length > 32768) return rejected("text_too_long", { limit_bytes: 32768 });
          play("reply", str(data.text));
          return accepted;
        case "mic_set":
          current.mic = data.on === true;
          setState(current.mic ? "listening" : "idle");
          return accepted;
        case "approval_answer":
          if (closedApprovals.has(data.approval_id)) return rejected("already_answered", { approval_id: data.approval_id });
          if (!open.has(data.approval_id)) return rejected("unknown_approval", { approval_id: data.approval_id });
          closeApproval(data.approval_id, "answered", data.decision);
          return accepted;
        case "stop":
          stopAll();
          return accepted;
        case "model_load":
          if (activeTurn) return rejected("turn_busy", { turn_id: activeTurn });
          if (str(data.entry_id) !== mockSettings.language_model) return rejected("unknown_entry", { entry_id: str(data.entry_id) });
          setState("loading", { model: str(data.entry_id) });
          setTimeout(() => setState("idle"), 400);
          return accepted;
        case "settings_set":
          if (!["speech_language", "system_prompt"].includes(str(data.key))) return rejected("setting_invalid", { key: str(data.key), reason: "unknown_key" });
          if (data.key === "speech_language" && typeof data.value !== "string") return rejected("setting_invalid", { key: "speech_language", reason: "invalid_value" });
          mockSettings[str(data.key)] = data.value;
          emit("settings", mockSettings);
          return accepted;
        default:
          return rejected("unknown_command", { type: command.type });
      }
    }

    return {
      scenes: Object.keys(scenes).filter((name) => name !== "reply"),
      play,
      /** @param {string|null} lastId @param {any} s */
      open(lastId, s) {
        const timer = setTimeout(() => attach(lastId, s), 120);
        return {
          cancel() {
            clearTimeout(timer);
            closeStream(s);
          },
        };
      },
      /** @param {string} body */
      async post(body) {
        await new Promise((resolve) => setTimeout(resolve, 60));
        if (down) throw new Error("connection lost");
        const command = JSON.parse(body);
        if (!answers.has(command.command_id)) answers.set(command.command_id, answer(command));
        return { status: 200, json: answers.get(command.command_id) };
      },
    };
  }

  // ---------- Bağlantı ----------

  /**
   * Kaynak sayfanın kendi köküdür (contract.md, "Kaynak"): belirteç yalnız sayfayı sunan kapıya gider, başka bir
   * yerel süreç onu alamaz. Yalnız `http://127.0.0.1:<kapı>`; `localhost`, başka adres ve `https` reddedilir.
   * @returns {string|null}
   */
  function pageSource() {
    const plain = location.protocol === "http:" && location.hostname === "127.0.0.1" && location.port !== "";
    return plain ? location.origin : null;
  }

  const fromFile = location.protocol === "file:";
  const base = fromFile ? null : pageSource();
  const mock = fromFile ? createMockTransport() : null;
  /** @type {any} */
  const transport = mock || (base ? fetchTransport(base) : null);

  const client = (() => {
    let attempt = 0;
    let handle = /** @type {{cancel: () => void}|null} */ (null);
    let watchdog = 0;
    let retryTimer = 0;
    let generation = 0;

    function stop() {
      generation += 1;
      clearTimeout(watchdog);
      clearTimeout(retryTimer);
      if (handle) handle.cancel();
      handle = null;
    }

    function retry() {
      stop();
      attempt += 1;
      setConn("reconnecting", { attempt });
      retryTimer = window.setTimeout(connect, Math.min(RETRY_LIMIT_MS, 500 * 2 ** (attempt - 1)));
    }

    function feed() {
      clearTimeout(watchdog);
      watchdog = window.setTimeout(retry, ui.heartbeatMs * 2.5);
    }

    function connect() {
      stop();
      const mine = generation;
      const live = () => mine === generation;
      if (attempt === 0) setConn("connecting");
      // Bırakılan bağlantının tamponda kalan çerçeveleri işlenmez: yeniden bağlanma aynı itişin içinde olabilir.
      const parser = createParser((frame) => {
        if (live()) receive(frame);
      }, () => {
        noteError({ code: "event_too_large", values: { limit_bytes: MAX_EVENT_BYTES } });
        retry();
      });
      handle = transport.open(ui.lastId, {
        opened() {
          if (!live()) return;
          attempt = 0;
          setConn("open");
          feed();
        },
        /** @param {Uint8Array} bytes */
        chunk(bytes) {
          if (!live()) return;
          feed();
          parser.push(bytes);
        },
        /** @param {number} status */
        closed(status) {
          if (!live()) return;
          if (status === 401) unauthorized();
          else if (status === 403) refuse("forbidden");
          else retry();
        },
      });
    }

    /** Yeniden denemenin işe yaramayacağı durumlar. @param {string} phase @param {Record<string, unknown>} [values] */
    function refuse(phase, values) {
      stop();
      setConn(phase, values);
    }

    /** `401`: belirteç vardıysa geçersizdir (Dost yeniden açıldı), silinir; yoksa kullanıcı girer (kutu). */
    function unauthorized() {
      const had = ui.token !== "";
      dropToken();
      refuse(had ? "lost" : "auth");
    }

    return { connect, refuse, retry, unauthorized };
  })();

  function newId() {
    const bytes = crypto.getRandomValues(new Uint8Array(8));
    return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
  }

  /** @param {string} type @param {any} data @param {string} [commandId] @returns {Promise<{ok: boolean, error?: any}>} */
  async function sendCommand(type, data, commandId) {
    const command_id = commandId || newId();
    let reply;
    try {
      reply = await transport.post(JSON.stringify({ v: PROTOCOL_VERSION, command_id, type, data }));
    } catch {
      return { ok: false, error: { code: "connection_lost" } };
    }
    if (reply.status === 401) client.unauthorized();
    const json = reply.json;
    if (json && json.status === "accepted") return { ok: true };
    return { ok: false, error: (json && json.error) || { code: "bad_request" } };
  }

  /** @param {string} type @param {any} data */
  async function command(type, data) {
    const reply = await sendCommand(type, data);
    if (!reply.ok) noteError(reply.error);
    return reply.ok;
  }

  // ---------- Çizim ----------

  /** @param {string} phase @param {Record<string, unknown>} [values] */
  function setConn(phase, values) {
    ui.conn = phase;
    ui.connValues = values || {};
    renderStatus();
  }

  function stateKey() {
    if (!connected()) return "offline";
    return ui.state;
  }

  function renderRing() {
    const state = stateKey();
    byId("ring").dataset.state = state;
    byId("right").dataset.state = state;
    const arc = byId("ringProgress");
    arc.classList.toggle("indeterminate", ui.progress === null);
    arc.setAttribute("stroke-dasharray", ui.progress === null ? "25 75" : `${ui.progress * 100} 100`);
    const text = byId("stateText");
    const top = byId("topState");
    for (const node of [text, top]) {
      if (state === "loading" && ui.progress !== null) {
        const percent = new Intl.NumberFormat(language, { style: "percent" }).format(ui.progress);
        bind(node, "state_loading_progress", { percent });
      } else {
        bind(node, `state_${state}`);
      }
    }
  }

  function renderConnection() {
    const text = byId("connText");
    const banner = byId("bannerConn");
    if (connected()) {
      bind(text, mock ? "conn_mock" : "conn_open");
      banner.hidden = true;
    } else {
      bind(text, `conn_${ui.conn}`, ui.connValues);
      bind(banner, `conn_${ui.conn}`, ui.connValues);
      banner.hidden = false;
    }
    byId("bannerMock").hidden = !mock;
    byId("tokenBox").hidden = ui.conn !== "auth";
    byId("pairRenew").hidden = mock !== null || !["pair_invalid", "lost"].includes(ui.conn);
    const model = byId("modelText");
    if (ui.model) {
      delete model.dataset.i18n;
      model.textContent = ui.model;
    } else {
      bind(model, "model_unknown");
    }
  }

  function renderControls() {
    const usable = connected();
    composer.disabled = !usable;
    byId("send").disabled = !usable;
    byId("stop").disabled = !usable || (!ui.activeTurn && cards.size === 0);
    const mic = byId("micButton");
    mic.disabled = !usable;
    mic.setAttribute("aria-pressed", String(ui.mic));
    bind(byId("micValue"), ui.mic ? "toggle_on" : "toggle_off");
    refreshCards();
  }

  function renderStatus() {
    renderRing();
    renderConnection();
    renderControls();
    renderSetup();
  }

  // Kurulum: `setup` durumunda konuşma dili ve ayarın dil modelini yükleyen düğme (indirme ve katalog sonraki dilimde).
  function renderSetup() {
    byId("setupBox").hidden = ui.state !== "setup";
    const model = str(ui.settings.language_model);
    const load = byId("loadButton");
    load.disabled = !connected() || model === "";
    const speech = /** @type {HTMLSelectElement} */ (byId("speechLanguage"));
    const current = str(ui.settings.speech_language);
    if (current !== "") speech.value = current;
    speech.disabled = !connected();
  }

  function renderMetrics() {
    const memory = num(ui.metrics.memory_bytes);
    const tps = num(ui.metrics.tokens_per_second);
    const first = num(ui.metrics.first_token_ms);
    byId("metricMemory").textContent = memory === null ? "—" : formatBytes(memory);
    const tpsNode = byId("metricTps");
    if (tps === null) {
      delete tpsNode.dataset.i18n;
      tpsNode.textContent = "—";
    } else {
      const value = new Intl.NumberFormat(language, { maximumFractionDigits: 1 }).format(tps);
      bind(tpsNode, "unit_tokens_per_second", { value });
    }
    byId("metricFirstToken").textContent = first === null ? "—" : formatDuration(first);
  }

  function renderTools() {
    byId("toolList").replaceChildren(...ui.tools.map((tool) => {
      const item = el("li");
      item.append(el("code", "", tool.name));
      if (tool.irreversible) item.append(bind(el("span", "warn-text"), "tool_irreversible"));
      return item;
    }));
    byId("toolsEmpty").hidden = ui.tools.length > 0;
  }

  function renderToggles() {
    const sheet = byId("toolSheet");
    const focused = document.body.classList.contains("focus");
    byId("toolsButton").setAttribute("aria-pressed", String(!sheet.hidden));
    byId("focusButton").setAttribute("aria-pressed", String(focused));
    bind(byId("toolsValue"), sheet.hidden ? "toggle_off" : "toggle_on");
    bind(byId("focusValue"), focused ? "toggle_on" : "toggle_off");
    byId("focusExit").hidden = !focused;
    byId("topState").hidden = !focused;
  }

  function fillScenes() {
    const select = byId("sceneSelect");
    const chosen = select.value;
    select.replaceChildren(...mock.scenes.map((/** @type {string} */ name) => {
      const option = /** @type {HTMLOptionElement} */ (el("option", "", t(`scene_${name}`)));
      option.value = name;
      return option;
    }));
    if (chosen) select.value = chosen;
  }

  function applyLanguage() {
    document.documentElement.lang = language;
    document.documentElement.dir = (dictionary[language] || {}).direction || "ltr";
    for (const node of document.querySelectorAll("[data-i18n]")) paint(/** @type {HTMLElement} */ (node));
    renderMetrics();
    if (mock) fillScenes();
    byId("languageSelect").value = language;
    refreshCards();
  }

  // ---------- Düğmeler ----------

  async function submit() {
    const text = composer.value.trim();
    if (!text || !connected()) return;
    if (await command("send_text", { text })) composer.value = "";
  }

  /** @param {boolean} on */
  function setFocusMode(on) {
    document.body.classList.toggle("focus", on);
    renderToggles();
    if (!on) byId("focusButton").focus();
  }

  function wire() {
    byId("send").addEventListener("click", submit);
    composer.addEventListener("keydown", (/** @type {KeyboardEvent} */ event) => {
      if (event.key === "Enter" && !event.isComposing) submit();
    });
    byId("stop").addEventListener("click", () => command("stop", {}));
    byId("micButton").addEventListener("click", () => command("mic_set", { on: !ui.mic }));
    byId("loadButton").addEventListener("click", () => command("model_load", { entry_id: str(ui.settings.language_model) }));
